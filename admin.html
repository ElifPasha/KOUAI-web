<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Yönetim Paneli — KOUAI</title>
<link rel="icon" type="image/svg+xml" href="assets/img/kouai-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("kouai-tema");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  body{min-height:100vh}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
  .bar .who{color:var(--muted);font-size:.88rem}
  .wrap{padding:36px 0 80px}
  .login{max-width:420px;margin:12vh auto 0}
  .login h1{font-size:1.7rem;margin-bottom:6px}
  .login p.sub{color:var(--muted);margin-bottom:22px;font-size:.95rem}
  .msg{display:none;padding:12px 15px;border-radius:var(--radius-sm);font-size:.9rem;margin-top:14px;background:var(--brand-softer);border:1px solid var(--border-strong);color:var(--brand-ink)}
  .msg.err{background:#FEF2F2;border-color:#FCA5A5;color:#991B1B}
  [data-theme="dark"] .msg.err{background:rgba(220,38,38,.14);border-color:rgba(248,113,113,.4);color:#FCA5A5}
  .msg.show{display:block}
  .sums{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 26px}
  .sum{padding:14px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .sum b{display:block;font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
  .sum span{color:var(--muted);font-size:.82rem}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
  .tools .field{flex:1 1 220px}
  .tools select,.tools input{padding:11px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);width:100%}
  .row{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden}
  .row.yeni{border-left:4px solid var(--brand)}
  .row summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:16px 20px}
  .row summary::-webkit-details-marker{display:none}
  .row summary strong{display:block}
  .row summary small{color:var(--muted)}
  .row .prev{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .when{color:var(--faint);font-size:.82rem;text-align:right}
  .detail{padding:4px 20px 20px;border-top:1px solid var(--border)}
  .detail pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin:16px 0}
  .detail textarea{width:100%;min-height:80px;padding:12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);resize:vertical}
  .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .btn--danger{background:transparent;color:#DC2626;border-color:#FCA5A5}
  .btn--danger:hover{background:#DC2626;color:#fff;border-color:#DC2626}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:var(--radius)}
  .tabs{display:flex;gap:8px;margin-bottom:26px;border-bottom:1px solid var(--border);overflow-x:auto}
  .tab{white-space:nowrap;padding:12px 20px;background:none;border:0;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
  .tab.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .fgrid .full{grid-column:1/-1}
  .fgrid select{padding:13px 15px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2)}
  .fgrid small,.hint{color:var(--faint);font-size:.8rem}
  .chk{display:flex;gap:10px;align-items:center;font-weight:500;font-size:.92rem}
  .preview{max-width:320px;max-height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--border);margin-top:8px}
  .erow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px}
  .ethumb{width:110px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  .ethumb.ph{display:grid;place-items:center;background:var(--surface-2);color:var(--faint);font-size:.75rem}
  .emeta small{color:var(--muted);display:block}
  .erow .acts{margin:0;justify-content:flex-end}
  @media(max-width:760px){.fgrid{grid-template-columns:1fr}.erow{grid-template-columns:1fr}.erow .acts{justify-content:flex-start}}
  [hidden]{display:none!important}
  @media(max-width:640px){.row summary{grid-template-columns:1fr}.row .when{text-align:left}}
</style>
</head>
<body>

<!-- Giriş -->
<main id="giris" class="container">
  <form class="form login" id="giris-formu">
    <div>
      <h1>Yönetim paneli</h1>
      <p class="sub">Başvuruları görmek için yönetici hesabınla giriş yap.</p>
    </div>
    <div class="field"><label for="g-mail">E-posta</label><input id="g-mail" type="email" required autocomplete="username"></div>
    <div class="field"><label for="g-sifre">Şifre</label><input id="g-sifre" type="password" required autocomplete="current-password"></div>
    <button class="btn btn--primary" type="submit" id="g-btn">Giriş yap</button>
    <div class="msg" id="g-msg" role="alert"></div>
  </form>
</main>

<!-- Panel -->
<div id="panel" hidden>
  <div class="container bar">
    <a class="brand" href="index.html"><span class="brand__mark" style="width:44px" aria-hidden="true"></span><span class="brand__text"><span class="brand__name">KOUAI</span><span class="brand__sub">Yönetim paneli</span></span></a>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="who" id="kim"></span>
      <button class="btn btn--ghost btn--sm" type="button" id="cikis">Çıkış yap</button>
    </div>
  </div>

  <main class="container wrap">
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" role="tab" aria-selected="true" data-sekme="basvuru">Başvurular</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-sekme="etkinlik">Etkinlikler</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-sekme="sponsor">Sponsorlar</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-sekme="yonetim">Yönetim Kurulu</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-sekme="proje">Projeler</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-sekme="arsiv">Arşiv</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-sekme="yonetici">Panel Yöneticileri</button>
    </div>
    <div id="sekme-basvuru">
    <div class="sums" id="ozet"></div>

    <div class="tools">
      <div class="field"><input id="ara" type="search" placeholder="Ad, e-posta veya mesajda ara" aria-label="Ara"></div>
      <div class="field" style="flex:0 1 170px"><select id="f-durum" aria-label="Duruma göre filtrele">
        <option value="">Tüm durumlar</option><option value="yeni">Yeni</option><option value="okundu">Okundu</option><option value="arsiv">Arşiv</option>
      </select></div>
      <div class="field" style="flex:0 1 220px"><select id="f-konu" aria-label="Konuya göre filtrele"><option value="">Tüm konular</option></select></div>
      <button class="btn btn--soft btn--sm" type="button" id="yenile">Yenile</button>
      <button class="btn btn--soft btn--sm" type="button" id="csv">CSV indir</button>
    </div>

    <div class="msg" id="p-msg" role="alert"></div>
    <div id="liste"></div>
    </div>

    <div id="sekme-etkinlik" hidden>
      <div class="tools"><button class="btn btn--primary btn--sm" type="button" id="e-yeni">Yeni etkinlik ekle</button></div>
      <div class="msg" id="e-msg" role="alert"></div>

      <form class="form" id="e-form" hidden style="margin-bottom:26px">
        <h2 id="e-baslik-ust" style="font-size:1.3rem">Yeni etkinlik</h2>
        <div class="fgrid">
          <div class="field full"><label for="ef-baslik">Başlık</label><input id="ef-baslik" required maxlength="160" placeholder="Örn. Prompt Mühendisliği Atölyesi"></div>
          <div class="field"><label for="ef-tarih">Tarih</label><input id="ef-tarih" type="date" required></div>
          <div class="field"><label for="ef-saat">Saat</label><input id="ef-saat" maxlength="40" placeholder="18:00 - 20:00"></div>
          <div class="field"><label for="ef-yer">Yer</label><input id="ef-yer" maxlength="160" placeholder="Mühendislik Fakültesi B-204 veya Zoom"></div>
          <div class="field"><label for="ef-tur">Tür</label><select id="ef-tur">
            <option value="egitim">Eğitim</option><option value="seminer" selected>Seminer</option><option value="atolye">Atölye</option><option value="yarisma">Yarışma</option><option value="sosyal">Sosyal</option></select></div>
          <div class="field full"><label for="ef-ozet">Açıklama</label><textarea id="ef-ozet" maxlength="1200" placeholder="Etkinlik kısaca nedir, kimler için?"></textarea></div>
          <div class="field"><label for="ef-etiket">Etiketler</label><input id="ef-etiket" placeholder="PyTorch, Ücretsiz, Online"><small>Virgülle ayır, en fazla 8 tane.</small></div>
          <div class="field"><label for="ef-link">Kayıt / detay bağlantısı</label><input id="ef-link" type="url" placeholder="https://..."><small>İsteğe bağlı.</small></div>
          <div class="field full">
            <label for="ef-gorsel">Görsel</label>
            <input id="ef-gorsel" type="file" accept="image/jpeg,image/png,image/webp">
            <small>JPG, PNG veya WebP. En fazla 3 MB. Yatay (geniş) görseller daha iyi görünür.</small>
            <img class="preview" id="ef-onizleme" alt="Görsel önizlemesi" hidden>
            <label class="chk" id="ef-kaldir-kap" hidden><input type="checkbox" id="ef-gorsel-kaldir"> Mevcut görseli kaldır</label>
          </div>
          <label class="chk"><input type="checkbox" id="ef-yayinda" checked> Sitede yayında</label>
          <label class="chk"><input type="checkbox" id="ef-one"> Ana sayfada öne çıkar</label>
        </div>
        <div class="acts">
          <button class="btn btn--primary btn--sm" type="submit" id="ef-kaydet">Kaydet</button>
          <button class="btn btn--ghost btn--sm" type="button" id="ef-iptal">Vazgeç</button>
        </div>
      </form>

      <div id="e-ice"></div>
      <div id="e-liste"></div>
    </div>

    <div id="sekme-sponsor" hidden></div>
    <div id="sekme-yonetim" hidden></div>
    <div id="sekme-proje" hidden></div>
    <div id="sekme-arsiv" hidden></div>
    <div id="sekme-yonetici" hidden></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/data.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var cfg = window.KOUAI_SUPABASE || {};

  // Logo (varsa)
  try {
    var m = $(".brand__mark");
    if (m && window.KOUAI_LOGO) m.innerHTML = '<svg viewBox="0 0 130.38 74" style="width:100%;height:auto;color:var(--brand-ink)" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="' + KOUAI_LOGO.amblem.d + '"/></svg>';
  } catch (e) {}

  function bildir(el, metin, hata) {
    el.textContent = metin || "";
    el.classList.toggle("err", !!hata);
    el.classList.toggle("show", !!metin);
  }

  if (!cfg.url || /PROJE-KODUN/.test(cfg.url) || !window.supabase) {
    bildir($("#g-msg"), "Supabase ayarları yapılmamış. assets/js/supabase-config.js dosyasını doldur.", true);
    $("#g-btn").disabled = true;
    return;
  }

  // Oturum yalnızca sekme açıkken tutulur (paylaşılan bilgisayarlara karşı)
  var db = window.supabase.createClient(cfg.url, cfg.anonKey, {
    auth: { persistSession: true, storage: window.sessionStorage, autoRefreshToken: true }
  });

  var kayitlar = [];
  var DURUM = { yeni: "Yeni", okundu: "Okundu", arsiv: "Arşiv" };

  /* ---------- Oturum ---------- */
  async function adminMi(user) {
    var r = await db.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
    return !r.error && !!r.data;
  }

  async function oturumuKur(session) {
    if (!session) { goster(false); return; }
    if (!(await adminMi(session.user))) {
      await db.auth.signOut();
      bildir($("#g-msg"), "Bu hesap yönetici olarak yetkilendirilmemiş.", true);
      goster(false);
      return;
    }
    $("#kim").textContent = session.user.email;
    goster(true);
    yukle();
  }

  function goster(panel) {
    $("#giris").hidden = panel;
    $("#panel").hidden = !panel;
  }

  $("#giris-formu").addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = $("#g-btn"); btn.disabled = true; bildir($("#g-msg"), "");
    var r = await db.auth.signInWithPassword({ email: $("#g-mail").value.trim(), password: $("#g-sifre").value });
    btn.disabled = false;
    $("#g-sifre").value = "";
    if (r.error) { bildir($("#g-msg"), "Giriş başarısız: " + r.error.message, true); return; }
    oturumuKur(r.data.session);
  });

  $("#cikis").addEventListener("click", async function () {
    await db.auth.signOut();
    kayitlar = []; $("#liste").textContent = "";
    goster(false);
  });

  /* ---------- Veri ---------- */
  async function yukle() {
    bildir($("#p-msg"), "");
    var r = await db.from("basvurular").select("*").order("created_at", { ascending: false }).limit(1000);
    if (r.error) { bildir($("#p-msg"), "Başvurular yüklenemedi: " + r.error.message, true); return; }
    kayitlar = r.data || [];
    konuSecenekleri();
    ciz();
  }

  function konuSecenekleri() {
    var sel = $("#f-konu"), mevcut = sel.value;
    var konular = Array.from(new Set(kayitlar.map(function (k) { return k.konu; }))).sort();
    sel.length = 1;
    konular.forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); });
    sel.value = konular.indexOf(mevcut) > -1 ? mevcut : "";
  }

  function filtreli() {
    var q = $("#ara").value.trim().toLocaleLowerCase("tr-TR");
    var d = $("#f-durum").value, k = $("#f-konu").value;
    return kayitlar.filter(function (x) {
      if (d && x.durum !== d) return false;
      if (k && x.konu !== k) return false;
      if (!q) return true;
      return (x.ad + " " + x.eposta + " " + x.mesaj).toLocaleLowerCase("tr-TR").indexOf(q) > -1;
    });
  }

  function tarih(s) {
    return new Date(s).toLocaleString("tr-TR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text; // textContent: kullanıcı girdisi HTML olarak yorumlanmaz
    return n;
  }

  function ciz() {
    var say = { yeni: 0, okundu: 0, arsiv: 0 };
    kayitlar.forEach(function (k) { say[k.durum]++; });
    var oz = $("#ozet"); oz.textContent = "";
    [["Toplam", kayitlar.length], ["Yeni", say.yeni], ["Okundu", say.okundu], ["Arşiv", say.arsiv]].forEach(function (a) {
      var s = el("div", "sum"); s.appendChild(el("b", "", a[1])); s.appendChild(el("span", "", a[0])); oz.appendChild(s);
    });

    var liste = $("#liste"); liste.textContent = "";
    var veri = filtreli();
    if (!veri.length) {
      liste.appendChild(el("div", "empty", kayitlar.length ? "Filtreye uyan başvuru yok. Filtreleri temizleyip tekrar dene." : "Henüz başvuru gelmedi. Siteden gelen mesajlar burada görünecek."));
      return;
    }
    veri.forEach(function (k) { liste.appendChild(satir(k)); });
  }

  function satir(k) {
    var d = el("details", "row " + k.durum);
    d.dataset.id = k.id;
    var s = el("summary");
    var a = el("div"); a.appendChild(el("strong", "", k.ad)); a.appendChild(el("small", "", k.eposta));
    var b = el("div", "prev", k.konu + " — " + k.mesaj.replace(/\s+/g, " "));
    var c = el("div", "when", tarih(k.created_at) + " · " + DURUM[k.durum]);
    s.append(a, b, c); d.appendChild(s);

    var det = el("div", "detail");
    det.appendChild(el("pre", "", k.mesaj));
    var not = el("textarea"); not.placeholder = "Yönetici notu (yalnızca panelde görünür)"; not.value = k.notlar || ""; not.maxLength = 2000;
    not.setAttribute("aria-label", "Yönetici notu");
    det.appendChild(not);

    var acts = el("div", "acts");
    function btn(text, cls, fn) { var x = el("button", "btn btn--sm " + cls, text); x.type = "button"; x.addEventListener("click", fn); acts.appendChild(x); return x; }
    btn("Notu kaydet", "btn--soft", function () { guncelle(k, { notlar: not.value.trim() || null }, "Not kaydedildi."); });
    if (k.durum !== "okundu") btn("Okundu işaretle", "btn--soft", function () { guncelle(k, { durum: "okundu" }, "Okundu olarak işaretlendi."); });
    if (k.durum !== "yeni") btn("Yeni olarak işaretle", "btn--ghost", function () { guncelle(k, { durum: "yeni" }, "Yeni olarak işaretlendi."); });
    if (k.durum !== "arsiv") btn("Arşivle", "btn--ghost", function () { guncelle(k, { durum: "arsiv" }, "Arşive taşındı."); });
    var yanit = el("a", "btn btn--sm btn--ghost", "E-posta ile yanıtla");
    yanit.href = "mailto:" + encodeURIComponent(k.eposta).replace(/%40/g, "@") + "?subject=" + encodeURIComponent("Re: " + k.konu);
    acts.appendChild(yanit);
    btn("Sil", "btn--danger", function () { sil(k); });
    det.appendChild(acts); d.appendChild(det);

    // Açılınca "yeni" ise otomatik okundu yap
    d.addEventListener("toggle", function () {
      if (d.open && k.durum === "yeni") guncelle(k, { durum: "okundu" }, null, true);
    });
    return d;
  }

  async function guncelle(k, alanlar, mesaj, sessiz) {
    var r = await db.from("basvurular").update(alanlar).eq("id", k.id).select().single();
    if (r.error) { bildir($("#p-msg"), "Güncellenemedi: " + r.error.message, true); return; }
    Object.assign(k, r.data);
    if (sessiz) { // yeniden çiz, ardından aynı satırı açık bırak
      ciz();
      var acilacak = document.querySelector('#liste details[data-id="' + k.id + '"]');
      if (acilacak) acilacak.open = true;
      return;
    }
    bildir($("#p-msg"), mesaj);
    ciz();
  }

  async function sil(k) {
    if (!confirm(k.ad + " kişisinin başvurusu kalıcı olarak silinecek. Emin misin?")) return;
    var r = await db.from("basvurular").delete().eq("id", k.id);
    if (r.error) { bildir($("#p-msg"), "Silinemedi: " + r.error.message, true); return; }
    kayitlar = kayitlar.filter(function (x) { return x.id !== k.id; });
    bildir($("#p-msg"), "Başvuru silindi.");
    konuSecenekleri(); ciz();
  }

  /* ---------- CSV ---------- */
  function csvHucre(v) {
    var s = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // Excel formül enjeksiyonuna karşı
    return '"' + s.replace(/"/g, '""') + '"';
  }
  $("#csv").addEventListener("click", function () {
    var veri = filtreli();
    if (!veri.length) { bildir($("#p-msg"), "Dışa aktarılacak kayıt yok.", true); return; }
    var satirlar = [["Tarih", "Ad Soyad", "E-posta", "Konu", "Durum", "Mesaj", "Not"]].concat(veri.map(function (k) {
      return [tarih(k.created_at), k.ad, k.eposta, k.konu, DURUM[k.durum], k.mesaj, k.notlar || ""];
    }));
    var csv = "\uFEFF" + satirlar.map(function (r) { return r.map(csvHucre).join(";"); }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "kouai-basvurular-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click(); URL.revokeObjectURL(a.href);
  });

  ["#ara", "#f-durum", "#f-konu"].forEach(function (s) { $(s).addEventListener("input", ciz); });
  $("#yenile").addEventListener("click", yukle);

  /* ================= Sekmeler ================= */
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { sekme(t.dataset.sekme); });
  });
  function sekme(ad) {
    document.querySelectorAll(".tab").forEach(function (t) {
      var a = t.dataset.sekme === ad;
      t.classList.toggle("on", a); t.setAttribute("aria-selected", String(a));

    baslik: function (r) { return r.ad; },
    alt: function (r) { return (r.etiketler || []).join(", ") || "Etiket yok"; },
    rozet: function (r) { return [r.durum, r.yayinda ? "Yayında" : "Gizli"]; },
    kaynak: function () {
      return typeof PROJELER === "undefined" ? [] : PROJELER.map(function (p, i) {
        return { ad: p.ad, ozet: p.ozet || null, etiketler: p.etiketler || [], durum: p.durum || "Geliştiriliyor", sira: i };
      });
    }
  }, $("#sekme-proje"));

  /* ---------- Arşiv (dönem kayıtları) ---------- */
  MODULLER.arsiv = modul({
    tablo: "arsiv", ad: "dönem kaydı",
    alanlar: [
      { k: "donem", t: "Dönem", req: 1, ph: "2025 — 2026" },
      { k: "sira", t: "Sıra (en yeni dönem 0 olsun)", tip: "number", v: 0 },
      { k: "ozet", t: "Dönemin kısa özeti", tip: "metin", full: 1, max: 800 },
      { k: "etkinlik_sayisi", t: "Etkinlik sayısı", tip: "number", v: 0 },
      { k: "katilimci_sayisi", t: "Katılımcı sayısı", tip: "number", v: 0 },
      { k: "proje_sayisi", t: "Proje sayısı", tip: "number", v: 0 },
      { k: "kayitlar", t: "Dönemin kayıtları (her satıra bir tane: Ad | Not)", tip: "metin", full: 1, ph: "Hackathon 2026 | 38 takım katıldı\nBootcamp | 64 mezun",
        goster: function (a) { return (a || []).map(function (k) { return k.ad + " | " + (k["not"] || ""); }).join("\n"); },
        cevir: function (s) {
          return s.split("\n").map(function (l) { return l.trim(); }).filter(Boolean).slice(0, 40).map(function (l) {
            var i = l.indexOf("|");
            return i < 0 ? { ad: l, "not": "" } : { ad: l.slice(0, i).trim(), "not": l.slice(i + 1).trim() };
          });
        } }
    ],
    kutular: [{ k: "yayinda", t: "Sitede yayında", v: true }],
    sirala: ["sira", "created_at"],
    baslik: function (r) { return r.donem + " Dönemi"; },
    alt: function (r) { return r.etkinlik_sayisi + " etkinlik · " + r.katilimci_sayisi + " katılımcı · " + r.proje_sayisi + " proje"; },
    rozet: function (r) { return [(r.kayitlar || []).length + " kayıt", r.yayinda ? "Yayında" : "Gizli"]; },
    kaynak: function () {
      return typeof ARSIV === "undefined" ? [] : ARSIV.map(function (a, i) {
        return { donem: a.donem, ozet: a.ozet || null, etkinlik_sayisi: a.sayilar.etkinlik, katilimci_sayisi: a.sayilar.katilimci,
                 proje_sayisi: a.sayilar.proje, kayitlar: a.kayitlar || [], sira: i };
      });
    }
  }, $("#sekme-arsiv"));

  /* ---------- Panel yöneticileri ---------- */
  MODULLER.yonetici = (function () {
    var kap = $("#sekme-yonetici"), yuklu = false, benimId = null;
    var bilgi = el("div", "msg show", "Yeni yönetici eklemek için önce Supabase'de Authentication → Users → Add user ile hesabı oluştur (“Auto Confirm User” işaretli olsun), sonra e-postasını aşağıya yaz. Bu bölüm yalnızca panel yetkisini verir ya da alır; hesabı silmez.");
    var msg = el("div", "msg"); msg.setAttribute("role", "alert");
    var form = el("form", "form"); form.style.cssText = "display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 26px";
    var f = el("div", "field"); f.style.flex = "1 1 260px";
    var lb = el("label", "", "Yönetici yapılacak kişinin e-postası");
    var inp = el("input"); inp.type = "email"; inp.required = true; inp.id = "yon-eposta"; inp.autocomplete = "off"; lb.htmlFor = inp.id;
    f.append(lb, inp);
    var ekle = el("button", "btn btn--primary btn--sm", "Yönetici yap"); ekle.type = "submit";
    form.append(f, ekle);
    var liste = el("div");
    kap.append(bilgi, msg, form, liste);

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault(); ekle.disabled = true; bildir(msg, "");
      var r = await db.rpc("yonetici_ekle", { p_eposta: inp.value.trim() });
      ekle.disabled = false;
      if (r.error) { bildir(msg, r.error.message, true); return; }
      bildir(msg, inp.value.trim() + " artık panele girebilir."); inp.value = ""; yukle();
    });

    async function yukle() {
      var k = await db.auth.getUser(); benimId = k.data && k.data.user ? k.data.user.id : null;
      var r = await db.rpc("yoneticileri_listele");
      if (r.error) { bildir(msg, "Liste alınamadı: " + r.error.message + " (yoneticiler.sql çalıştırıldı mı?)", true); return; }
      yuklu = true; liste.textContent = "";
      (r.data || []).forEach(function (y) {
        var s = el("div", "erow"); s.style.gridTemplateColumns = "minmax(0,1fr) auto";
        var m = el("div", "emeta"); m.appendChild(el("strong", "", y.eposta));
        m.appendChild(el("small", "", "Yetki: " + tarih(y.eklenme) + " · Son giriş: " + (y.son_giris ? tarih(y.son_giris) : "—")));
        if (y.user_id === benimId) { var tg = el("div", "tag-list"); tg.style.marginTop = "8px"; tg.appendChild(el("span", "tag", "Sen")); m.appendChild(tg); }
        s.appendChild(m);
        if (y.user_id !== benimId) {
          var a = el("div", "acts"), b = el("button", "btn btn--sm btn--danger", "Yetkiyi kaldır"); b.type = "button";
          b.addEventListener("click", async function () {
            if (!confirm(y.eposta + " artık panele giremeyecek. Emin misin?")) return;
            var x = await db.rpc("yonetici_cikar", { p_user: y.user_id });
            if (x.error) { bildir(msg, x.error.message, true); return; }
            bildir(msg, "Yetki kaldırıldı."); yukle();
          });
          a.appendChild(b); s.appendChild(a);
        }
        liste.appendChild(s);
      });
    }
    return { yukle: function () { if (!yuklu) yukle(); } };
  })();

  // Başlangıç: mevcut oturum varsa doğrudan aç
  db.auth.getSession().then(function (r) { oturumuKur(r.data.session); });
  db.auth.onAuthStateChange(function (ev) { if (ev === "SIGNED_OUT") goster(false); });
})();
</script>
</body>
</html>
